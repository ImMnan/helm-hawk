{{ if eq .Values.main.embedding.name "e5-large" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-e5large
  namespace: {{ .Release.Namespace }}
  labels:
    {{- with .Values.labels.embedding }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    tag: {{ .Chart.Version }}-{{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- with .Values.labels.embedding }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      tag: {{ .Chart.Version }}-{{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- with .Values.labels.embedding }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        tag: {{ .Chart.Version }}-{{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "helm-rag_vLLM.serviceAccountName" . }}
      automountServiceAccountToken: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: model-cache
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-{{ .Values.main.embedding.name }}-cache
      initContainers:
      - name: download-models-gcs
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
        command:
          - sh
          - -c
          - |
            set -euo pipefail
            mkdir -p /models/hub
            # Sync the pre-uploaded HF hub cache from GCS into local PVC.
            gcloud storage rsync -r gs://rag-model-weights-hawk/.cache/huggingface/hf-cache/hub /models/hub
            test -d /models/hub/models--intfloat--multilingual-e5-large
            ls -la /models/hub | head -n 40
        volumeMounts:
        - name: model-cache
          mountPath: /models
      containers:
      - name: e5large-ctr
        image: {{ .Values.images.embedding.image }}:{{ .Values.images.embedding.tag }}
        imagePullPolicy: {{ .Values.images.embedding.pullPolicy }}
        ports:
        - containerPort: {{ (index .Values.services.embedding.ports 0).targetPort }}
          name: embed-http
        env:
        - name: EMBED_MODEL
          value: "intfloat/multilingual-e5-large"
        - name: HF_HOME
          value: "/models"
        - name: HF_HUB_CACHE
          value: "/models/hub"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: model-cache
          mountPath: /models
          readOnly: true
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 8Gi
      # Bind the pod to the KSA that is linked to a GSA with storage.objectViewer
      # (or storage.objectAdmin if you need writes) on the bucket.

{{ end }}
