apiVersion: v1
data:
  mongod.conf: |-
    systemLog:
     destination: file
     path: /proc/1/fd/1
     logAppend: true
    storage:
     dbPath: /data/db
    net:
     bindIp: 0.0.0.0
     port: 27017
    security:
     authorization: enabled
kind: ConfigMap
metadata:
  name: mongo-config
  namespace: {{ .Release.Namespace }}