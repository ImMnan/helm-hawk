apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: hawk
  {{ with .Values.labels.apiserver }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: hawk-apiserver
spec:
  replicas: 1
  selector:
  {{with .Values.labels.apiserver }}  
    matchLabels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  strategy: {}
  template:
    metadata:
  {{with .Values.labels.apiserver }}    
      labels:
      {{- toYaml . | nindent 8 }}
  {{- end }}
    spec:
      containers:
      - image: "{{ .Values.images.apiserver.repository }}:{{ .Values.images.apiserver.tag }}"
        imagePullPolicy: {{ .Values.images.apiserver.pullPolicy }}
        name: hawk-apiserver
        ports:
        - containerPort: 3000
        env:  
        - name: CRED_FILE_PATH
          value: "/etc/hawk-apiserver/secret.txt"
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/hawk-apiserver/
          readOnly: true
      volumes:
      - name: secret-volume
        secret: 
          secretName: hawk-api-secret