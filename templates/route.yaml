apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: hawk-ai-gateway
  hostnames:
    - infer.hawk-llm.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/rag-go
      backendRefs:
        - name: {{ .Release.Name }}-{{ .Values.services.orca.name }}
          port: {{ (index .Values.services.orca.ports 0).port }}
    - matches: 
        - path: 
            type: PathPrefix
            value: /q1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: qdrant-service
          port: 6333
          
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ .Release.Name }}-grpc-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: hawk-ai-gateway
      sectionName: grpc
  hostnames:
    - infer.hawk-llm.ai
  rules:
    - backendRefs:
        - name: qdrant-service
          port: 6334