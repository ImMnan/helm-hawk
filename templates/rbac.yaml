apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hawk-controller-role
  namespace: hawk
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hawk-controller-rb
  namespace: hawk
subjects:
  - kind: ServiceAccount
    name: hawk-sa
    namespace: hawk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hawk-controller-role