{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "helm-rag_vLLM.serviceAccountName" . }}
  {{- with .Values.serviceAccount.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount | default true }}
{{- end }}
    # Workload Identity binding applied:
    # gcloud iam service-accounts add-iam-policy-binding support-sales@appspot.gserviceaccount.com \
    #   --role=roles/iam.workloadIdentityUser \
    #   --member="serviceAccount:support-sales.svc.id.goog[hawk/rag-gateway-ksa]"