apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  {{ with .Values.labels.ui }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ .Release.Name }}-ui
spec:
  replicas: 1
  selector:
  {{ with .Values.labels.ui }}
    matchLabels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  template:
    metadata:
    {{ with .Values.labels.ui }}
      labels:
        {{- toYaml . | nindent 8 }}
    {{ end }}
    spec:
      containers:
      - image: "{{ .Values.images.ui.repository }}:{{ .Values.images.ui.tag }}"
        imagePullPolicy: {{ .Values.images.ui.pullPolicy }}
        name: hawk-ui-ctr
        ports:
        - containerPort: {{ .Values.services.ui.targetPort }}
        env:  
        - name: NODE_ENV
          value: "production"
        - name: BASE_URL
          value: "http://{{ .Release.Name }}-{{ .Values.services.apiserver.name }}:{{ .Values.services.apiserver.port }}"
        - name: BASE_PATH
          value: "/v1"
        {{- with .Values.resources.ui }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}          
        {{- with .Values.probes.ui }}  
        livenessProbe:
          {{- toYaml .livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .readinessProbe | nindent 10 }}
        {{- end }}