apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: hawk
  {{  with .Values.labels.ui }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: hawk-ui
spec:
  replicas: 1
  selector:
  {{ with .Values.labels.ui }}
    matchLabels:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  template:
    metadata:
    {{ with .Values.labels.ui }}
      labels:
        {{- toYaml . | nindent 8 }}
    {{ end }}
    spec:
      containers:
      - image: "{{ .Values.images.ui.repository }}:{{ .Values.images.ui.tag }}"
        imagePullPolicy: {{ .Values.images.ui.pullPolicy }}
        name: hawk-ui
        ports:
        - containerPort: 5000
        env:  
        - name: NODE_ENV
          value: "production"
        - name: BASE_URL
          value: "http://hawk-apiserver-svc:3000"
        - name: BASE_PATH
          value: "/v1"