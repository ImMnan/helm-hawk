apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hawk-ai-gateway
  namespace: hawk
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: infer.hawk-llm.ai
    - name: grpc
      protocol: HTTP
      port: 6334
      hostname: infer.hawk-llm.ai
