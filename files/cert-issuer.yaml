apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: hawk
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: infer-orca-llm
  namespace: hawk
spec:
  secretName: orca-infer-tls
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
  dnsNames:
    - orca-infer.ai