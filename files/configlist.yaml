- name: perfecto-live-doc
  type: doc
  id: perfecto-live-doc-2314151
  description: "this is a sample doc sync"
  sync:
    enabled: true
    mode: local-agent
    image: immnan/hawk-llm:0.2.1
    schedule: "0 */12 * * *"
    job-template: /etc/hawk/template/job-git.yaml
    sources:
    - type: git
      name: perfecto-live-git
      sharedVolume:
        name: hawk-volume
        path: /opt/hawk-data/
      git:
        url: "https://github.com/PerfectoMobileDev/flare-doc.git"
        branch: main
        dirList: ["content/Perfecto"]
        ignoreDirList: ["content/Perfecto/rest-api", "content/Perfecto/system-admin", "content/Perfecto/legacy"]
        credentials: 
          type: secret
          name: git-secret-token
          path: /etc/hawk/secrets/
    apiServer:
      type: hawk-api-server
      name: hawk-api-service
      connection:
        serviceName: hawk-apiserver-svc
        port: 3000
        # IF serviceName, endpoint is ignored, endpoint is more of an external database setup
      # endpoint: 10.2.24.1:2121
      credentials:
        type: secret
        name: name-secret-token
        path: /etc/hawk/secrets